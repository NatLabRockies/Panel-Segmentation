name: pytest

on: [pull_request, push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        env: ['-r requirements.txt']

    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true
    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install ${{ matrix.env }}
      run: |
        python -m pip install --upgrade pip
        pip install ${{ matrix.env }}
    - name: Install panel_segmentation
      run: |
        pip install .
    - name: Install native system dependencies
      run: |
        sudo apt-get update
        sudo apt-get update
        sudo apt-get install -y \
          libgl1 \
          libglapi-mesa \
          libgles2 \
          libegl-mesa0 \
          libxcb-dri2-0 \
          libxcb-dri3-0 \
          libxcb-glx0 \
          libxcb-present0 \
          libxcb-sync1 \
          libxshmfence1 \
          libxxf86vm1
    - name: Install pytest
      run: |
        pip install pytest pytest-forked
    - name: Test with pytest ${{ matrix.env }}
      env:
        OMP_NUM_THREADS: "1"
        OPEN3D_CPU_RENDERING: "true"
      run: |
        pytest --forked